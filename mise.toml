[tools]
bun = "1.4.2"
python = "3.12.11"
uv = "0.12.0"

[env]
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Initialize pinned submodules and install locked dependencies"
run = [
  "git submodule update --init --recursive",
  "uv sync --locked",
  "cd opencode && bun install --frozen-lockfile",
]

[tasks.verify]
description = "Verify the upstream pin and wrapper configuration"
run = "uv run --locked python scripts/verify.py"

[tasks.check]
description = "Run the upstream canonical lint and type checks"
dir = "opencode"
run = "bun run check"

[tasks."test:location"]
description = "Run isolated upstream location and session lifecycle regressions"
dir = "opencode/packages/core"
run = "bun run test test/location-activity.test.ts test/location-layer.test.ts test/session-execution.test.ts"

[tasks.ci]
description = "Run the same checks locally and in GitHub Actions (after setup)"
run = [
  "mise run verify",
  "mise run check",
  "mise run test:location",
]
